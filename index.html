<!DOCTYPE html>
<html>

<head>
    <title>Drawing Request Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Drawing Request Generator</h1>

<p>Create a sentence using random words.</p>

<div id="toolbox">

    <h2>Toolbox</h2>

    <button class="tool" data-type="text">
        Text
    </button>

    <button class="tool" data-type="adjective">
        Adjective
    </button>

    <button class="tool" data-type="noun">
        Noun
    </button>

    <button class="tool" data-type="verb">
        Verb
    </button>

</div>

<hr>

<h2>Sentence</h2>

<div id="sentence"></div>

<hr>

<button id="generateButton">
Generate Sentence
</button>

<p id="output"></p>

<script src="script.js"></script>

</body>

</html>
