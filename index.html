<!DOCTYPE html>
<html>

<head>
    <title>Drawing Request Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Drawing Request Generator</h1>

<p>Create a sentence using random words.</p>

<div id="toolbox">

    <button
        class="tool"
        data-type="text">
        Text
    </button>

    <div id="dictionaryTools"></div>

</div>

<hr>

<h2>Sentence</h2>

<div id="sentence"></div>

<div id="deleteZone">
    🗑 Drag here to delete
</div>

<hr>

<button id="clearButton">
    Clear All
</button>

<button id="generateButton">
    Generate Sentence
</button>

<p id="output"></p>

<script src="script.js"></script>

</body>

</html>
