<!DOCTYPE html>
<html>

<head>
    <title>Drawing Request Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Drawing Request Generator</h1>

<p>Create a sentence using random words.</p>

<div id="toolbox">

    <button
        class="tool"
        data-type="text">
        Text
    </button>

    <div id="dictionaryTools"></div>

    <hr>

    <button id="customCategoryButton">
        Add Custom Category
    </button>

    <input
        type="file"
        id="customCategoryFile"
        accept=".txt"
        multiple
        hidden
    >

</div>

<hr>

<h2>Sentence</h2>

<div id="sentence"></div>

<div id="deleteZone">
    🗑 Drag here to delete
</div>

<hr>

<button id="clearButton">
    Clear All
</button>

<button id="generateButton">
    Generate Sentence
</button>

<button id="surpriseButton">
    Surprise Me!
</button>

<p id="output"></p>

<video
    id="surpriseVideo"
    src="videos/surprise.mp4"
    controls
    hidden>
</video>

<script src="script.js"></script>

</body>

</html>
